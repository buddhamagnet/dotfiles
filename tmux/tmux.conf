# PREFIX

# remap prefix key
set -g prefix C-a
# press prefix twice to send to another application
bind C-a send-prefix

set-option -g allow-rename off

# RESPONSIVENESS

set -g escape-time 1
set -g visual-activity on
setw -g monitor-activity on

# CONFIGURATION

# reload tmux configuration
bind r source-file ~/.tmux.conf \; display "tmux reload"

# MOUSE mode-keys
bind m set -g mouse on
bind M set -g mouse off

# TEXT AND BUFFERS

setw -g mode-keys vi

# COLOURS
set -g default-terminal "tmux-256color"
set -g status-style fg=white,bg=black

setw -g window-status-style fg=cyan,bg=default,dim
setw -g window-status-current-style fg=white,bg=red,bright

set -g pane-border-style fg=green,bg=black
set -g pane-active-border-style fg=white,bg=yellow

set -g message-style fg=white,bg=black,bright

# STATUS BAR

set -g status-left "#[fg=green]#S "
set -g status-left-length 20
set -g status-right "#[fg=cyan]%d %b %R"

# TPM Plugin Manager Path
set-environment -g TMUX_PLUGIN_MANAGER_PATH '$HOME/.config/tmux/plugins'

# TPM Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Show the window NAME (#W) in the status bar, not the pane title (#T).
# Catppuccin defaults both of these to " #T", which ignores window names.
# Must be set BEFORE TPM initialization (catppuccin uses set -ogq).
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Status bar configuration
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Initialize TPM (Tmux Plugin Manager)
# Must be at the very end of tmux.conf
run '~/.config/tmux/plugins/tpm/tpm'
